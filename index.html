<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zorixos — macOS-like Web Desktop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Boot overlay (starts visible, then fades) -->
  <div id="boot-overlay" class="boot">
    <div class="boot-center">
      <div class="apple-logo"></div>
      <div id="boot-progress" class="boot-progress"></div>
    </div>
  </div>

  <!-- Menu bar -->
  <div id="menubar" class="menubar">
    <div class="menubar-left">Zorixos</div>
    <div class="menubar-right">h1collab</div>
  </div>

  <!-- Desktop -->
  <div id="desktop" class="desktop">
    <div id="dock" class="dock">
      <button class="dock-item" data-app="finder">Finder</button>
      <button class="dock-item" data-app="notes">Notes</button>
      <button class="dock-item" data-app="encrypt">Encrypt</button>
    </div>

    <!-- Example desktop icon -->
    <div class="icon" data-app="finder" tabindex="0">
      <div class="icon-img">📁</div>
      <div class="icon-label">Finder</div>
    </div>
  </div>

  <!-- App windows container -->
  <div id="windows"></div>

  <script src="app.js"></script>
</body>
</html>
