<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PrivacyC — Desktop</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="desktop.css">
</head>
<body>
  <div id="boot-screen" class="boot" role="status" aria-live="polite">
    <div class="boot-inner">
      <div class="logo">PrivacyC</div>
      <div class="spinner" aria-hidden="true"></div>
      <div class="boot-text">Initializing...</div>
    </div>
  </div>

  <div id="desktop" class="desktop hidden" role="application" aria-label="PrivacyC Desktop">
    <div class="dock" role="toolbar" aria-label="Dock">
      <button class="dock-item" data-app="about" aria-label="About">
        <!-- SVG icon about -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" />
          <rect x="11" y="10" width="2" height="6" fill="currentColor" />
          <rect x="11" y="7" width="2" height="2" fill="currentColor" />
        </svg>
      </button>
      <button class="dock-item" data-app="settings" aria-label="Settings">
        <!-- SVG icon settings -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z" fill="currentColor" />
          <path d="M19.4 15a7.9 7.9 0 0 0 .1-1 7.9 7.9 0 0 0-.1-1l2.1-1.6a.5.5 0 0 0 .1-.7l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a8 8 0 0 0-1.8-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a8 8 0 0 0-1.8 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.7L4.5 13a8 8 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.7l2 3.5c.1.2.4.3.6.2l2.5-1a8 8 0 0 0 1.8 1l.4 2.6c.1.2.3.4.5.4h4c.2 0 .4-.2.5-.4l.4-2.6a8 8 0 0 0 1.8-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.7L19.4 15z" fill="currentColor" opacity="0.12"/>
        </svg>
      </button>
      <button class="dock-item" data-app="terminal" aria-label="Terminal">
        <!-- SVG terminal icon -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 6l6 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20 6H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="icons" role="list">
      <button class="icon" data-app="about" role="listitem" aria-label="About">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>About</span>
      </button>
      <button class="icon" data-app="settings" role="listitem" aria-label="Settings">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z" fill="currentColor"/></svg>
        <span>Settings</span>
      </button>
      <button class="icon" data-app="terminal" role="listitem" aria-label="Terminal">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6l6 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 6H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Terminal</span>
      </button>
    </div>
  </div>

  <template id="window-template">
    <div class="window" role="dialog" aria-modal="false">
      <div class="window-titlebar">
        <div class="window-title"></div>
        <div class="window-controls">
          <button class="btn-close" aria-label="Close window">✕</button>
        </div>
      </div>
      <div class="window-body"></div>
    </div>
  </template>

  <script type="module" src="main.js"></script>
  <script nomodule src="app.js"></script>
</body>
</html>
