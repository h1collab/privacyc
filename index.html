<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ZorixOS — mac-like window simulator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="menubar" role="banner">
    <div class="menubar-left"> ZorixOS</div>
    <div class="menubar-right">
      <span id="time" aria-live="polite"></span>
      <button id="settingsBtn" aria-label="Settings">⚙︎</button>
    </div>
  </div>

  <main id="desktop" tabindex="0" role="main" aria-label="Desktop area">
    <!-- Sample windows -->
    <section class="window" data-title="Finder" style="left:80px;top:100px;">
      <div class="titlebar" role="toolbar">
        <div class="traffic">
          <button class="close" aria-label="Close window"></button>
          <button class="minimize" aria-label="Minimize window"></button>
          <button class="zoom" aria-label="Zoom window"></button>
        </div>
        <div class="title">Finder</div>
      </div>
      <div class="content">
        <h1>Welcome to ZorixOS</h1>
        <p>这是一个 mac 风格窗口模拟器。拖动标题栏移动窗口，使用右下角抓手改变大小。</p>
      </div>
      <div class="resizer" aria-hidden="true"></div>
    </section>

    <section class="window" data-title="Notes" style="left:420px;top:160px;">
      <div class="titlebar">
        <div class="traffic">
          <button class="close" aria-label="Close window"></button>
          <button class="minimize" aria-label="Minimize window"></button>
          <button class="zoom" aria-label="Zoom window"></button>
        </div>
        <div class="title">Notes</div>
      </div>
      <div class="content">
        <textarea placeholder="Type notes..." aria-label="Notes editor"></textarea>
      </div>
      <div class="resizer" aria-hidden="true"></div>
    </section>
  </main>

  <nav class="dock" role="navigation" aria-label="Dock">
    <button class="dock-item" data-app="Finder">Finder</button>
    <button class="dock-item" data-app="Notes">Notes</button>
  </nav>

  <aside id="settings" class="panel hidden" role="dialog" aria-modal="true" aria-label="Settings">
    <h2>Settings</h2>
    <label><input type="checkbox" id="customCursor"> 启用自定义光标</label>
    <label><input type="checkbox" id="showDock" checked> 显示 Dock</label>
    <label><input type="checkbox" id="darkMode"> 深色模式</label>
    <div class="panel-actions">
      <button id="closeSettings">关闭</button>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
