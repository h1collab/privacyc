<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PrivacyC — Desktop</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="desktop.css">
</head>
<body>
  <div id="boot-screen" class="boot">
    <div class="boot-inner">
      <div class="logo">PrivacyC</div>
      <div class="spinner" aria-hidden="true"></div>
      <div class="boot-text">Initializing...</div>
    </div>
  </div>

  <div id="desktop" class="desktop hidden" role="application" aria-label="PrivacyC Desktop">
    <div class="dock">
      <button class="dock-item" data-app="about">About</button>
      <button class="dock-item" data-app="settings">Settings</button>
      <button class="dock-item" data-app="terminal">Terminal</button>
    </div>
    <div class="icons">
      <div class="icon" data-app="about">About</div>
      <div class="icon" data-app="settings">Settings</div>
      <div class="icon" data-app="terminal">Terminal</div>
    </div>
  </div>

  <template id="window-template">
    <div class="window">
      <div class="window-titlebar">
        <div class="window-title"></div>
        <div class="window-controls">
          <button class="btn-close">✕</button>
        </div>
      </div>
      <div class="window-body"></div>
    </div>
  </template>

  <!-- Load compiled JS module -->
  <script type="module" src="main.js"></script>
  <!-- Legacy fallback -->
  <script nomodule src="app.js"></script>
</body>
</html>
